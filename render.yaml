services:
  - type: web
    name: bus-tracking-api
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run uvicorn apsrtc_alerts.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: bus-tracking-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
      - key: DATABASE_PATH
        value: /var/data/bus_alerts.sqlite3
      - key: TELEGRAM_MESSAGE_LOG_DIR
        value: /var/data/logs
      - key: POLL_SECONDS
        value: "60"
      - key: MORNING_ALERT_START
        value: "08:00"
      - key: MORNING_ALERT_END
        value: "10:00"
      - key: EVENING_ALERT_START
        value: "15:00"
      - key: EVENING_ALERT_END
        value: "17:00"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_EVENING_BOT_TOKEN
        sync: false

  - type: worker
    name: bus-tracking-morning-bot
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run python -m apsrtc_alerts.bot
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
      - key: BOT_PROFILE
        value: morning
      - key: ALERTS_API_URL
        fromService:
          type: web
          name: bus-tracking-api
          property: hostport
      - key: TELEGRAM_BOT_TOKEN
        fromService:
          type: web
          name: bus-tracking-api
          envVarKey: TELEGRAM_BOT_TOKEN

  - type: worker
    name: bus-tracking-evening-bot
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run python -m apsrtc_alerts.bot
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
      - key: BOT_PROFILE
        value: evening
      - key: ALERTS_API_URL
        fromService:
          type: web
          name: bus-tracking-api
          property: hostport
      - key: TELEGRAM_EVENING_BOT_TOKEN
        fromService:
          type: web
          name: bus-tracking-api
          envVarKey: TELEGRAM_EVENING_BOT_TOKEN
