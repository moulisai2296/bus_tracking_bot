[project]
name = "apsrtc-bus-alerts"
version = "0.1.0"
description = "Local APSRTC bus lookup API and Telegram boarding alerts"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "fastapi>=0.115",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

